# Mosquitto Configuration for Alert Manager
# Dual-port setup: internal unauth + external TLS with auth

# Basic settings
pid_file /mosquitto/data/mosquitto.pid
persistence true
persistence_location /mosquitto/data/

# Logging - Enable debug level for troubleshooting
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type debug
log_timestamp true
connection_messages true

# Internal listener (port 1883) - No auth for container network
listener 1883
allow_anonymous true
protocol mqtt

# External listener (port 8883, exposed as 42690) - TLS with username/password auth
listener 8883
protocol mqtt
# TLS encryption (server-side only - client cert NOT required)
cafile /mosquitto/certs/ca/ca.crt
certfile /mosquitto/certs/ca/server.crt
keyfile /mosquitto/certs/ca/server.key
# ESP32/Windows compatibility - TLSv1.2 with hardware-accelerated cipher suites
tls_version tlsv1.2
ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256
# Authentication - username/password ONLY (client certificates disabled for simplicity)
require_certificate false
use_identity_as_username false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf
# Connection limits for stability
max_connections 500
max_inflight_messages 20
max_queued_messages 1000

# WebSocket listener (port 9001) - For web clients
listener 9001
protocol websockets
allow_anonymous true