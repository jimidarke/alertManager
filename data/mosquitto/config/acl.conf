# MQTT Access Control List
# Alert Manager - ESP32 LED Sign Devices Only
#
# Architecture:
# - Port 1883 (internal): Anonymous access for Docker containers
# - Port 8883/42690 (external): TLS + username/password for ESP32 devices ONLY
#
# All other clients (scripts, services, integrations) use HTTP gateway.
# See: docs/CLIENTNODE.md, docs/ESP32_BETABRITE_IMPLEMENTATION.md

# ====================================================================
# ANONYMOUS USERS (Internal Docker Network - Port 1883 Only)
# ====================================================================
# Full access for internal containers (alert-router, file-logger, etc.)
# These rules apply before any 'user' directive
topic readwrite alerts/#
topic readwrite ledSign/#
topic readwrite health/#

# ====================================================================
# EXTERNAL CLIENTS (Port 42690 - ESP32 LED Devices ONLY)
# ====================================================================
# Zone-specific LED sign devices per mqttservernotes.txt spec
# Each device:
# - Reads messages for its zone only
# - Writes status telemetry (rssi, ip, uptime, memory)

# Jimi's Office LED Sign
user ledsign_jimioffice
topic read ledSign/jimioffice/#
topic write ledSign/jimioffice/rssi
topic write ledSign/jimioffice/ip
topic write ledSign/jimioffice/uptime
topic write ledSign/jimioffice/memory

# ====================================================================
# ALERT MANAGER SERVICE USER
# ====================================================================
# Internal service that publishes messages to all LED sign zones
# Can write to any zone's message topic, read all LED status
user alert_manager
topic write ledSign/+/message
topic read ledSign/#
topic read alerts/service/status

# ====================================================================
# ADD NEW LED SIGN DEVICES BELOW
# ====================================================================
# Template for adding new zone:
#
# user ledsign_{zone}
# topic read ledSign/{zone}/#
# topic write ledSign/{zone}/rssi
# topic write ledSign/{zone}/ip
# topic write ledSign/{zone}/uptime
# topic write ledSign/{zone}/memory
#
# After adding ACL rules:
# 1. Create user: ./tools/mqtt-auth-manager.sh add ledsign_{zone}
# 2. Restart broker: docker-compose restart mqtt-broker
# 3. Configure ESP32 with username/password + ca.crt
