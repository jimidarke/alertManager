<!--
  Alert Manager - change password page (v3.0.0)

  Like login.html, this deliberately does NOT extend layout.html. The page
  is reachable in two very different states, and one of them is a hard gate:
  when the visitor's account has must_change_password set, the
  before_request hook in gateway/__init__.py redirects EVERY other page here
  until the password is changed. Rendering layout.html's nav on that gate
  would show Dashboard/Logs/Admin links that all bounce straight back to
  this page -- chrome that exists only to be a dead end. The standalone
  centered card matches login.html and reads as what it is: a step to
  complete, not a place in the app.

  The nav's one genuinely useful control in that state, "Log out", is
  reproduced as a small POST form below so a user who lands on the gate is
  never trapped.

  Shares base.css and the csrf_token() Jinja global with every other form in
  the app. No common.js: nothing interactive here.

  Rendered by gateway/auth/routes.py's `_render_change_password_page()`,
  which passes:
    - forced: True when the visitor is here because must_change_password is
      set (shows the explanatory banner and suppresses the Cancel link).
    - error: None, or a specific validation message. Unlike login.html's
      deliberately generic error, being specific is correct here -- the
      visitor is already authenticated, so "current password is incorrect"
      leaks nothing they don't already know.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alert Manager - Change Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Change Password</h1>

      {% if forced %}
      <div class="flash flash-warning" role="alert">
        You must change your password before continuing.
      </div>
      {% endif %}

      {% if error %}
      <div class="flash flash-error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label for="cp-current">Current password</label>
          <input type="password" id="cp-current" name="current_password"
                 autocomplete="current-password" required autofocus>
        </div>

        <div class="form-group">
          <label for="cp-new">New password</label>
          <input type="password" id="cp-new" name="new_password"
                 autocomplete="new-password" minlength="{{ min_length }}" required>
          <small class="form-hint">At least {{ min_length }} characters.</small>
        </div>

        <div class="form-group">
          <label for="cp-confirm">Confirm new password</label>
          <input type="password" id="cp-confirm" name="confirm_password"
                 autocomplete="new-password" minlength="{{ min_length }}" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Change password</button>
      </form>

      <form method="post" action="{{ url_for('auth.logout') }}" class="auth-secondary">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-link">Log out</button>
      </form>
    </div>
  </div>
</body>
</html>
